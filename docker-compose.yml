version: '3.8'

services:
  realcommerce-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realcommerce-frontend
    ports:
      - "8080:80"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 256M

  realcommerce-lojavirtual:
    build:
      context: ./lojavirtual
      dockerfile: Dockerfile
    container_name: realcommerce-lojavirtual
    ports:
      - "8081:80"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 256M